<html lang="en">
<body>
    <table border="2" cellpadding="5">
        {% for p in product %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.name }}</td>
            <td>{{ p.price }}</td>
            <td>{{ p.quantity }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
